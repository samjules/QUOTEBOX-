<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QuoteFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <div class="w-64 bg-gray-900">
            <div class="flex flex-col h-full">
                <div class="flex items-center justify-center h-16 bg-gray-800">
                    <span class="text-white text-xl font-bold">QuoteFlow</span>
                </div>
                <nav class="flex-1 px-2 py-4 space-y-1">
                    <a href="dashboard.html" class="bg-gray-800 text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                        <span>Dashboard</span>
                    </a>
                    <a href="leads.html" class="text-gray-300 hover:bg-gray-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                        <span>Leads</span>
                    </a>
                    <a href="form-builder.html" class="text-gray-300 hover:bg-gray-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                        <span>Form Builder</span>
                    </a>
                    <a href="billing.html" class="text-gray-300 hover:bg-gray-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                        <span>Billing & Credits</span>
                    </a>
                    <a href="settings.html" class="text-gray-300 hover:bg-gray-700 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                        <span>Settings</span>
                    </a>
                </nav>
                <div class="p-4">
                    <button id="logoutBtn" class="w-full bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition">
                        Logout
                    </button>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-auto">
            <div class="py-6">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <h1 class="text-2xl font-semibold text-gray-900">Dashboard</h1>
                </div>
                <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8">
                    <div class="py-4">
                        <div class="grid grid-cols-1 gap-5 sm:grid-cols-3 mb-8">
                            <div class="bg-white overflow-hidden shadow rounded-xl">
                                <div class="p-5">
                                    <div class="flex items-center">
                                        <div class="flex-shrink-0">
                                            <div class="flex items-center justify-center h-12 w-12 rounded-md bg-indigo-600 text-white text-2xl">
                                                📊
                                            </div>
                                        </div>
                                        <div class="ml-5 w-0 flex-1">
                                            <dl>
                                                <dt class="text-sm font-medium text-gray-500 truncate">Total Leads</dt>
                                                <dd class="text-3xl font-semibold text-gray-900" id="totalLeads">0</dd>
                                            </dl>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white overflow-hidden shadow rounded-xl">
                                <div class="p-5">
                                    <div class="flex items-center">
                                        <div class="flex-shrink-0">
                                            <div class="flex items-center justify-center h-12 w-12 rounded-md bg-yellow-500 text-white text-2xl">
                                                🆕
                                            </div>
                                        </div>
                                        <div class="ml-5 w-0 flex-1">
                                            <dl>
                                                <dt class="text-sm font-medium text-gray-500 truncate">New Leads</dt>
                                                <dd class="text-3xl font-semibold text-gray-900" id="newLeads">0</dd>
                                            </dl>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white overflow-hidden shadow rounded-xl">
                                <div class="p-5">
                                    <div class="flex items-center">
                                        <div class="flex-shrink-0">
                                            <div class="flex items-center justify-center h-12 w-12 rounded-md bg-green-500 text-white text-2xl">
                                                ✅
                                            </div>
                                        </div>
                                        <div class="ml-5 w-0 flex-1">
                                            <dl>
                                                <dt class="text-sm font-medium text-gray-500 truncate">Booked Leads</dt>
                                                <dd class="text-3xl font-semibold text-gray-900" id="bookedLeads">0</dd>
                                            </dl>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white shadow rounded-xl">
                            <div class="px-4 py-5 sm:px-6 border-b border-gray-200">
                                <h3 class="text-lg leading-6 font-medium text-gray-900">Recent Leads</h3>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                        </tr>
                                    </thead>
                                    <tbody id="leadsTable" class="bg-white divide-y divide-gray-200">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log("=== DASHBOARD SCRIPT STARTING ===");
        
        // Use EXACT same pattern as leads.html
        const SUPABASE_URL = 'https://jpchpqjnyabtpptufkcj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwY2hwcWpueWFidHBwdHVma2NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMDAyNTAsImV4cCI6MjA4NjY3NjI1MH0.FCywHhyz8N0Hkl-jK9RxZyh2KFZMrP8aUSXt1oJQbHY';
        
        console.log("Creating Supabase client with URL:", SUPABASE_URL);
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("Supabase client created:", sb);

        let accountId = null;
        let userId = null;

        async function checkAuth() {
            console.log("\n=== 1. CHECKING AUTHENTICATION ===");
            
            try {
                console.log("Calling sb.auth.getUser()...");
                const { data: { user }, error } = await sb.auth.getUser();
                
                console.log("Auth response received");
                console.log("- User:", user);
                console.log("- Error:", error);
                
                if (error) {
                    console.error("❌ Auth error occurred:", error);
                    window.location.href = 'login.html';
                    return;
                }

                if (!user) {
                    console.log("❌ No user found, redirecting to login...");
                    window.location.href = 'login.html';
                    return;
                }

                console.log("✅ User authenticated successfully");
                console.log("- User ID:", user.id);
                console.log("- User email:", user.email);
                userId = user.id;

                console.log("\n=== 2. LOOKING UP ACCOUNT ===");
                console.log("Querying accounts table where owner_id =", user.id);
                
                const { data: account, error: accountError } = await sb
                    .from('accounts')
                    .select('*')
                    .eq('owner_id', user.id)
                    .single();

                console.log("Account query response:");
                console.log("- Data:", account);
                console.log("- Error:", accountError);

                if (accountError) {
                    console.error("❌ Account lookup error:", accountError);
                    return;
                }

                if (!account) {
                    console.error("❌ Account query returned null");
                    return;
                }

                console.log("✅ Account found successfully");
                console.log("- Account ID:", account.id);
                console.log("- Business name:", account.business_name);
                
                accountId = account.id;
                
                await loadDashboard();
            } catch (err) {
                console.error("❌ UNEXPECTED ERROR in checkAuth:", err);
                console.log("Error stack:", err.stack);
            }
        }

        async function loadDashboard() {
            console.log("\n=== 3. LOADING DASHBOARD DATA ===");
            console.log("Account ID to query:", accountId);
            
            try {
                console.log("Querying leads table where account_id =", accountId);
                
                // Use EXACT same query as leads.html
                const { data: leads, error } = await sb
                    .from('leads')
                    .select('*')
                    .eq('account_id', accountId)
                    .order('created_at', { ascending: false });

                console.log("Leads query response:");
                console.log("- Data:", leads);
                console.log("- Error:", error);
                console.log("- Number of leads:", leads ? leads.length : 0);

                if (error) {
                    console.error("❌ Error loading leads:", error);
                    console.log("- Error code:", error.code);
                    console.log("- Error message:", error.message);
                    return;
                }

                console.log("✅ Leads loaded successfully");
                const allLeads = leads || [];
                console.log("Total leads in allLeads array:", allLeads.length);
                
                if (allLeads.length > 0) {
                    console.log("First lead sample:", allLeads[0]);
                }
                
                // Update stats
                document.getElementById('totalLeads').textContent = allLeads.length;
                const newLeads = allLeads.filter(l => l.status === 'new');
                document.getElementById('newLeads').textContent = newLeads.length;
                const bookedLeads = allLeads.filter(l => l.status === 'booked');
                document.getElementById('bookedLeads').textContent = bookedLeads.length;
                
                console.log("Stats updated - Total:", allLeads.length, "New:", newLeads.length, "Booked:", bookedLeads.length);

                // Display recent 10 leads
                const recentLeads = allLeads.slice(0, 10);
                console.log("Displaying recent leads:", recentLeads.length);
                
                const tbody = document.getElementById('leadsTable');
                tbody.innerHTML = '';

                if (recentLeads.length === 0) {
                    console.log("⚠️ No leads to display");
                    const emptyRow = document.createElement('tr');
                    emptyRow.innerHTML = '<td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">No leads yet. They will appear here once you receive them.</td>';
                    tbody.appendChild(emptyRow);
                } else {
                    recentLeads.forEach((lead, index) => {
                        console.log(`Rendering lead ${index + 1}:`, lead.name, lead.email);
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${lead.name || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${lead.email || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${lead.phone || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(lead.status)}">
                                    ${lead.status}
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(lead.created_at).toLocaleDateString()}</td>
                        `;
                        tbody.appendChild(row);
                    });
                    console.log("✅ All", recentLeads.length, "leads rendered");
                }
                
                console.log("✅ Dashboard loaded successfully");
            } catch (err) {
                console.error("❌ UNEXPECTED ERROR in loadDashboard:", err);
                console.log("Error stack:", err.stack);
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case 'new': return 'bg-yellow-100 text-yellow-800';
                case 'contacted': return 'bg-blue-100 text-blue-800';
                case 'booked': return 'bg-green-100 text-green-800';
                case 'lost': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            console.log("\n=== LOGGING OUT ===");
            await sb.auth.signOut();
            console.log("✅ Signed out, redirecting to login");
            window.location.href = 'login.html';
        });

        console.log("\n=== INITIALIZING DASHBOARD ===");
        checkAuth();
    </script>
</body>
</html>
