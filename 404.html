<!DOCTYPE html>
<html>
<head>
<script>
  const slug = window.location.pathname.replace(/^\//, '').split('/')[0];
  if (slug && !slug.endsWith('.html') && !slug.endsWith('.css') && !slug.endsWith('.js')) {
    window.location.replace('/quote-form.html?slug=' + encodeURIComponent(slug));
  } else {
    window.location.replace('/');
  }
</script>
</head>
<body></body>
</html>
